<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CIUP demo stage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" />
<style>
  :root { --brand: #47d7ac; --accent: #0a7d5e; --ink: #1e2023; --muted: #5d6370; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Jost", ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: radial-gradient(90% 120% at 100% 0%, #dff7ee 0%, transparent 60%), radial-gradient(70% 90% at 0% 100%, #ece8f7 0%, transparent 60%), #f6f6f9;
  }
  .slant { position: absolute; inset: 0 0 0 auto; width: 760px; background: var(--brand); clip-path: polygon(28% 0, 100% 0, 100% 100%, 0 100%); opacity: .95; }

  /* captions */
  .left { position: absolute; left: 150px; top: 0; bottom: 0; width: 760px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  .brand img { width: 44px; height: 44px; border-radius: 11px; }
  .steps { list-style: none; padding: 0; margin: 56px 0 0; display: grid; gap: 26px; }
  .steps li { display: flex; gap: 22px; align-items: center; color: var(--muted); opacity: .45; transition: opacity .6s ease, color .6s ease; }
  .steps li.active { opacity: 1; color: #000; }
  .steps li.done { opacity: .55; }
  .num { flex: none; width: 54px; height: 54px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.06); transition: background .5s, color .5s; }
  li.active .num { background: var(--ink); color: #fff; }
  li.done .num { background: var(--brand); }
  .st { font-size: 32px; font-weight: 600; line-height: 1.15; transform-origin: left center; transition: transform .6s ease; }
  li.active .st { transform: scale(1.32); }

  /* phone (scaled up 1.15x around its centre; .zoomer zooms the whole phone in on one spot) */
  .zoomer { position: absolute; inset: 0; transform-origin: 0 0; transition: transform 1.1s cubic-bezier(.65,0,.35,1); }
  .phone { position: absolute; left: 1191px; top: 104px; transform: scale(1.15); width: 418px; height: 872px; border-radius: 68px; background: #111; padding: 14px; box-shadow: 0 0 0 2px #2b2b2e inset, 0 40px 90px rgba(20,30,40,.35), 0 10px 25px rgba(20,30,40,.2); }
  .screen { position: relative; width: 390px; height: 844px; border-radius: 55px; overflow: hidden; background: #fff; }
  iframe { position: absolute; inset: 0; width: 390px; height: 844px; border: 0; }
  .status { position: absolute; z-index: 5; left: 0; right: 0; top: 0; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 44px; font: 600 17px -apple-system, "SF Pro Text", system-ui, sans-serif; color: #000; pointer-events: none; transition: color .3s, background .3s; }
  .status.light { color: #fff; }
  .status.solid { background: #fff; }
  .status .time { width: 60px; text-align: center; transition: opacity .3s; }
  .status.lock .time { opacity: 0; }
  .island { position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; background: #000; border-radius: 20px; }
  .icons { display: flex; gap: 6px; align-items: center; }
  .icons svg { fill: currentColor; }

  /* finger */
  .touch { position: absolute; z-index: 20; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(30,32,35,.22); border: 2px solid rgba(255,255,255,.85); box-shadow: 0 4px 14px rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .25s, transform .15s; }
  .touch.on { opacity: 1; }
  .touch.press { transform: scale(.78); background: rgba(30,32,35,.35); }

  /* title cards */
  .card { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #f6f6f9; transition: opacity .9s ease; }
  .card.hidden { opacity: 0; pointer-events: none; }
  .card img { width: 96px; height: 96px; border-radius: 24px; }
  .card h1 { font-size: 72px; font-weight: 600; margin: 34px 0 0; letter-spacing: -.01em; }
  .card p { font-size: 30px; color: var(--muted); margin: 14px 0 0; }
  .card .bar { width: 120px; height: 8px; border-radius: 4px; background: var(--brand); margin-top: 36px; }
</style>
</head>
<body>
  <div class="slant"></div>

  <div class="left">
    <div class="brand"><img src="/apple-icon.png" alt="" /><span id="brand"></span></div>
    <ol class="steps" id="steps"></ol>
  </div>

  <div class="zoomer" id="zoomer">
  <div class="phone">
    <div class="screen" id="screen">
      <div class="status light lock" id="status">
        <span class="time" id="clock">7:00</span>
        <span class="island"></span>
        <span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.4 0 2.6.5 3.5 1.4l1.3-1.3A6.6 6.6 0 0 0 8 4c-1.9 0-3.6.7-4.8 1.9l1.3 1.3c.9-.9 2.1-1.4 3.5-1.4zM8 9.4l2-2a2.9 2.9 0 0 0-4 0l2 2z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2"/><rect x="25" y="4" width="1.6" height="5" rx=".8" opacity=".4"/></svg>
        </span>
      </div>
      <iframe id="app" title="app"></iframe>
    </div>
  </div>
  </div>

  <div class="touch" id="touch"></div>

  <div class="card" id="card"><img src="/apple-icon.png" alt="" /><h1 id="cardTitle"></h1><p id="cardSub"></p><div class="bar"></div></div>

<script>
  window.stage = {
    setup({ brand, steps }) {
      document.getElementById("brand").textContent = brand;
      document.getElementById("steps").innerHTML = steps
        .map((s, i) => `<li><span class="num">${i + 1}</span><div class="st">${s.title}</div></li>`)
        .join("");
    },
    step(n) {
      [...document.querySelectorAll("#steps li")].forEach((li, i) => {
        li.classList.toggle("active", i === n);
        li.classList.toggle("done", i < n);
      });
    },
    /** Zooms the phone so that the rect (page coordinates) is centred at the phone's centre, k times bigger. null resets. */
    zoom(rect, k) {
      const z = document.getElementById("zoomer");
      if (!rect) return (z.style.transform = "");
      const cx = 1400, cy = 540, rx = rect.x + rect.width / 2, ry = rect.y + rect.height / 2;
      z.style.transform = `translate(${cx - k * rx}px, ${cy - k * ry}px) scale(${k})`;
    },
    card(title, sub) {
      const c = document.getElementById("card");
      if (title === null) return c.classList.add("hidden");
      document.getElementById("cardTitle").textContent = title;
      document.getElementById("cardSub").textContent = sub;
      c.classList.remove("hidden");
    },
    status(mode, time) {
      const s = document.getElementById("status");
      s.classList.toggle("light", mode === "lock");
      s.classList.toggle("lock", mode === "lock");
      s.classList.toggle("solid", mode === "app");
      if (time) document.getElementById("clock").textContent = time;
    },
    touch(x, y, state) {
      const t = document.getElementById("touch");
      if (x != null) { t.style.left = x + "px"; t.style.top = y + "px"; }
      t.classList.toggle("on", state !== "off");
      t.classList.toggle("press", state === "press");
    },
    touchMove(x1, y1, x2, y2, ms) {
      const t = document.getElementById("touch");
      t.style.transition = "none";
      t.style.left = x1 + "px"; t.style.top = y1 + "px";
      t.classList.add("on");
      t.getBoundingClientRect();
      t.style.transition = `opacity .25s, transform .15s, left ${ms}ms cubic-bezier(.45,0,.25,1), top ${ms}ms cubic-bezier(.45,0,.25,1)`;
      t.style.left = x2 + "px"; t.style.top = y2 + "px";
      setTimeout(() => { t.style.transition = ""; t.classList.remove("on"); }, ms);
    },
  };
</script>
</body>
</html>
